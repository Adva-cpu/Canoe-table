<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Читательский дневник — Полка и циклы</title>
    <style>
        :root {
            --bg: #111114;
            --surface: #19191e;
            --surface-2: #222229;
            --text: #ececef;
            --muted: #9a9aa6;
            --accent: #8b5cf6;
            --accent-soft: rgba(139, 92, 246, 0.16);
            --shelf: #2c211b;
            --shelf-edge: #46342a;
            --border: #2d2d37;
            --green: #22c55e;
            --amber: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 980px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 24px 60px rgba(0,0,0,0.55);
            display: flex;
            flex-direction: column;
        }

        /* Верхняя панель навигации */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            background: #151519;
            flex-wrap: wrap;
        }

        .nav-tabs { display: flex; gap: 8px; flex-wrap: wrap; }

        .tab-btn {
            background: var(--surface-2);
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 7px 14px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: 0.15s;
        }
        .tab-btn:hover { color: var(--text); }
        .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        .btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .btn:hover { opacity: 0.92; }
        .btn-ghost {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 7px 12px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-ghost:hover { color: var(--text); border-color: var(--muted); }

        .content { padding: 22px; flex: 1; }

        /* Обложка */
        .cover-card {
            min-height: 440px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: radial-gradient(circle at top, rgba(139,92,246,0.18), transparent 60%), var(--surface-2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px;
            gap: 16px;
        }
        .cover-title { font-size: 2rem; font-weight: 800; letter-spacing: 0.5px; }
        .cover-sub { color: var(--muted); max-width: 460px; line-height: 1.5; }

        /* Книжная полка */
        .shelf-section { margin-bottom: 28px; }
        .shelf-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .shelf-row {
            display: flex;
            align-items: flex-end;
            gap: 14px;
            padding: 18px 18px 0;
            background: var(--surface-2);
            border-radius: 12px 12px 0 0;
            border: 1px solid var(--border);
            border-bottom: none;
            min-height: 185px;
            overflow-x: auto;
        }

        .shelf-plank {
            height: 16px;
            background: linear-gradient(180deg, var(--shelf-edge), var(--shelf));
            border-radius: 0 0 8px 8px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 18px rgba(0,0,0,0.45);
        }

        .book-spine {
            min-width: 118px;
            max-width: 135px;
            height: 158px;
            border-radius: 6px 10px 4px 4px;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.14);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
            position: relative;
        }
        .book-spine:hover { transform: translateY(-8px); box-shadow: 0 12px 24px rgba(0,0,0,0.5); }
        .book-spine.series { border-style: dashed; border-width: 2px; }

        .spine-tag {
            font-size: 0.68rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 5px;
            background: rgba(0,0,0,0.35);
            align-self: flex-start;
        }
        .spine-title { font-size: 0.88rem; font-weight: 700; line-height: 1.25; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
        .spine-author { font-size: 0.72rem; color: rgba(255,255,255,0.82); margin-top: 4px; }

        /* Дерево цикла */
        .tree-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .tree-root {
            display: inline-block;
            background: var(--accent-soft);
            border: 1px solid var(--accent);
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .tree-branches {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            position: relative;
            padding-left: 14px;
            border-left: 2px solid var(--border);
        }

        .tree-node {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            cursor: pointer;
            transition: 0.15s;
            position: relative;
        }
        .tree-node:hover { border-color: var(--accent); transform: translateY(-2px); }
        .tree-node::before {
            content: "";
            position: absolute;
            left: -16px;
            top: 22px;
            width: 14px;
            height: 2px;
            background: var(--border);
        }
        .node-order { font-size: 0.72rem; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
        .node-title { font-weight: 700; font-size: 0.98rem; margin-bottom: 6px; }
        .node-status { font-size: 0.76rem; color: var(--muted); }

        /* Меню / страница книги */
        .book-detail-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 22px;
        }
        @media (max-width: 760px) {
            .book-detail-grid { grid-template-columns: 1fr; }
        }

        .panel {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }

        .field { margin-bottom: 14px; }
        .field label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 5px; }
        .field input, .field select, .field textarea {
            width: 100%;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 11px;
            font-size: 0.9rem;
            outline: none;
        }
        .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }

        .criteria-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 8px;
        }
        .criterion-box {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
        }
        .criterion-box select {
            width: auto;
            padding: 3px 6px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="app">
    <div class="topbar">
        <div class="nav-tabs">
            <button class="tab-btn" id="tab-cover" onclick="switchView('cover')">1. Обложка</button>
            <button class="tab-btn active" id="tab-shelf" onclick="switchView('shelf')">2. Книжная полка</button>
            <button class="tab-btn" id="tab-tree" onclick="switchView('tree')">3. Дерево цикла</button>
            <button class="tab-btn" id="tab-book" onclick="switchView('book')">4. Меню книги</button>
        </div>
        <div style="display: flex; gap: 8px;">
            <button class="btn" onclick="addBookToCurrentOrShelf()">+ Добавить книгу</button>
        </div>
    </div>

    <div class="content" id="viewContainer"></div>
</div>

<script>
    const initialData = {
        series: [
            { id: 's1', title: 'Дюна (Цикл)', author: 'Фрэнк Герберт', color: '#7c3aed' },
            { id: 's2', title: 'Тёмная Башня', author: 'Стивен Кинг', color: '#b45309' }
        ],
        books: [
            {
                id: 'b1',
                seriesId: 's1',
                order: 1,
                title: 'Дюна',
                author: 'Фрэнк Герберт',
                genre: 'Научная фантастика',
                status: 'reading',
                rating: 5,
                pagesRead: 245,
                pagesTotal: 704,
                color: '#6d28d9',
                criteria: { plot: 5, world: 5, characters: 4, style: 5 },
                quotes: '«Я не должен бояться. Страх убивает разум...»',
                notes: 'Сильная атмосфера Арракиса, отличная политическая игра.'
            },
            {
                id: 'b2',
                seriesId: 's1',
                order: 2,
                title: 'Мессия Дюны',
                author: 'Фрэнк Герберт',
                genre: 'Научная фантастика',
                status: 'plan',
                rating: 0,
                pagesRead: 0,
                pagesTotal: 320,
                color: '#5b21b6',
                criteria: { plot: 0, world: 0, characters: 0, style: 0 },
                quotes: '',
                notes: ''
            },
            {
                id: 'b3',
                seriesId: 's2',
                order: 1,
                title: 'Стрелок',
                author: 'Стивен Кинг',
                genre: 'Тёмное фэнтези',
                status: 'done',
                rating: 4,
                pagesRead: 256,
                pagesTotal: 256,
                color: '#92400e',
                criteria: { plot: 4, world: 5, characters: 4, style: 5 },
                quotes: '«Человек в чёрном унёсся через пустыню, а следом за ним шёл стрелок».',
                notes: 'Сухой, тягучий стиль, начало большого пути.'
            },
            {
                id: 'b4',
                seriesId: null,
                order: 1,
                title: 'Поток',
                author: 'Михай Чиксентмихайи',
                genre: 'Психология',
                status: 'done',
                rating: 5,
                pagesRead: 460,
                pagesTotal: 460,
                color: '#0f766e',
                criteria: { plot: 4, world: 4, characters: 4, style: 5 },
                quotes: 'Концентрация на грани сложности и навыка.',
                notes: 'Полезно для понимания фокуса внимания и вовлечённости.'
            }
        ]
    };

    let state = JSON.parse(localStorage.getItem('shelfDiaryV1')) || initialData;
    let currentView = 'shelf';
    let activeSeriesId = state.series[0]?.id || null;
    let activeBookId = state.books[0]?.id || null;

    function persist() {
        localStorage.setItem('shelfDiaryV1', JSON.stringify(state));
    }

    function switchView(view) {
        currentView = view;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + view)?.classList.add('active');
        render();
    }

    function openSeriesTree(seriesId) {
        activeSeriesId = seriesId;
        switchView('tree');
    }

    function openBookMenu(bookId) {
        activeBookId = bookId;
        const book = state.books.find(b => b.id === bookId);
        if (book?.seriesId) activeSeriesId = book.seriesId;
        switchView('book');
    }

    function addBookToCurrentOrShelf() {
        const seriesId = currentView === 'tree' ? activeSeriesId : null;
        const seriesBooks = state.books.filter(b => b.seriesId === seriesId);
        const newBook = {
            id: 'b_' + Date.now(),
            seriesId,
            order: seriesBooks.length + 1,
            title: 'Новая книга',
            author: 'Автор',
            genre: '',
            status: 'plan',
            rating: 0,
            pagesRead: 0,
            pagesTotal: 300,
            color: '#4f46e5',
            criteria: { plot: 0, world: 0, characters: 0, style: 0 },
            quotes: '',
            notes: ''
        };
        state.books.push(newBook);
        activeBookId = newBook.id;
        persist();
        switchView('book');
    }

    function updateBook(field, value) {
        const book = state.books.find(b => b.id === activeBookId);
        if (!book) return;
        book[field] = value;
        if (field === 'status' && value === 'done') {
            book.pagesRead = book.pagesTotal;
        }
        persist();
    }

    function updateCriterion(key, val) {
        const book = state.books.find(b => b.id === activeBookId);
        if (!book) return;
        book.criteria[key] = Number(val);
        persist();
    }

    function render() {
        const container = document.getElementById('viewContainer');

        if (currentView === 'cover') {
            container.innerHTML = `
                <div class="cover-card">
                    <div class="spine-tag" style="background: var(--accent-soft); color: var(--accent);">ЛИЧНЫЙ ДНЕВНИК</div>
                    <div class="cover-title">Читательский дневник</div>
                    <p class="cover-sub">
                        Начни с книжной полки, открой дерево цикла или перейди сразу в карточку книги, чтобы заполнить оценки, цитаты и заметки.
                    </p>
                    <div style="display:flex; gap:10px; margin-top:8px; flex-wrap:wrap; justify-content:center;">
                        <button class="btn" onclick="switchView('shelf')">Перейти на полку →</button>
                        <button class="btn-ghost" onclick="switchView('book')">Открыть меню книги</button>
                    </div>
                </div>
            `;
            return;
        }

        if (currentView === 'shelf') {
            const standaloneBooks = state.books.filter(b => !b.seriesId);
            container.innerHTML = `
                <div class="shelf-section">
                    <div class="shelf-label">
                        <span>Циклы и серии (нажми — откроется дерево цикла)</span>
                        <span>${state.series.length} шт.</span>
                    </div>
                    <div class="shelf-row">
                        ${state.series.map(s => {
                            const count = state.books.filter(b => b.seriesId === s.id).length;
                            return `
                                <div class="book-spine series" style="background:${s.color}" onclick="openSeriesTree('${s.id}')">
                                    <span class="spine-tag">ЦИКЛ • ${count}</span>
                                    <div>
                                        <div class="spine-title">${s.title}</div>
                                        <div class="spine-author">${s.author}</div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                    <div class="shelf-plank"></div>
                </div>

                <div class="shelf-section">
                    <div class="shelf-label">
                        <span>Отдельные книги на полке (нажми — откроется меню книги)</span>
                        <span>${standaloneBooks.length} шт.</span>
                    </div>
                    <div class="shelf-row">
                        ${standaloneBooks.map(b => `
                            <div class="book-spine" style="background:${b.color}" onclick="openBookMenu('${b.id}')">
                                <span class="spine-tag">${b.status === 'done' ? '✓ Прочтено' : b.status === 'reading' ? 'Читаю' : 'В планах'}</span>
                                <div>
                                    <div class="spine-title">${b.title}</div>
                                    <div class="spine-author">${b.author}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="shelf-plank"></div>
                </div>
            `;
            return;
        }

        if (currentView === 'tree') {
            const series = state.series.find(s => s.id === activeSeriesId) || state.series[0];
            const items = state.books
                .filter(b => b.seriesId === series?.id)
                .sort((a, b) => a.order - b.order);

            container.innerHTML = `
                <div class="tree-header">
                    <div>
                        <div style="font-size:0.78rem; color:var(--muted);">ДЕРЕВО ЦИКЛА</div>
                        <h2 style="font-size:1.35rem; margin-top:2px;">${series ? series.title : 'Цикл не выбран'}</h2>
                    </div>
                    <button class="btn-ghost" onclick="switchView('shelf')">← Назад на полку</button>
                </div>

                <div class="tree-root">📚 ${series?.title || 'Серия'} — ${series?.author || ''}</div>

                <div class="tree-branches">
                    ${items.map(b => {
                        const st = b.status === 'done' ? '✅ Прочитано' : b.status === 'reading' ? '📖 Читаю сейчас' : '⏳ В планах';
                        return `
                            <div class="tree-node" onclick="openBookMenu('${b.id}')">
                                <div class="node-order">Книга № ${b.order}</div>
                                <div class="node-title">${b.title}</div>
                                <div class="node-status">${st} • ${b.pagesRead}/${b.pagesTotal} стр.</div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
            return;
        }

        if (currentView === 'book') {
            const book = state.books.find(b => b.id === activeBookId) || state.books[0];
            if (!book) {
                container.innerHTML = '<p>Книг пока нет.</p>';
                return;
            }
            activeBookId = book.id;

            container.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:10px; flex-wrap:wrap;">
                    <div style="font-size:0.85rem; color:var(--muted);">МЕНЮ КНИГИ • автосохранение</div>
                    <div style="display:flex; gap:8px;">
                        ${book.seriesId ? `<button class="btn-ghost" onclick="openSeriesTree('${book.seriesId}')">← В дерево цикла</button>` : ''}
                        <button class="btn-ghost" onclick="switchView('shelf')">На полку</button>
                    </div>
                </div>

                <div class="book-detail-grid">
                    <div class="panel">
                        <div class="field">
                            <label>Название</label>
                            <input type="text" value="${book.title}" oninput="updateBook('title', this.value)">
                        </div>
                        <div class="field">
                            <label>Автор</label>
                            <input type="text" value="${book.author}" oninput="updateBook('author', this.value)">
                        </div>
                        <div class="field">
                            <label>Жанр</label>
                            <input type="text" value="${book.genre || ''}" oninput="updateBook('genre', this.value)">
                        </div>
                        <div class="field">
                            <label>Статус</label>
                            <select onchange="updateBook('status', this.value)">
                                <option value="reading" ${book.status === 'reading' ? 'selected' : ''}>Читаю сейчас</option>
                                <option value="done" ${book.status === 'done' ? 'selected' : ''}>Прочитано</option>
                                <option value="plan" ${book.status === 'plan' ? 'selected' : ''}>В планах</option>
                            </select>
                        </div>
                        <div class="field">
                            <label>Страниц прочитано / всего</label>
                            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                                <input type="number" value="${book.pagesRead}" min="0" onchange="updateBook('pagesRead', Number(this.value))">
                                <input type="number" value="${book.pagesTotal}" min="1" onchange="updateBook('pagesTotal', Number(this.value))">
                            </div>
                        </div>
                        <div class="field">
                            <label>Оценка по критериям (0–5)</label>
                            <div class="criteria-grid">
                                ${[
                                    ['plot', 'Сюжет'],
                                    ['world', 'Мир'],
                                    ['characters', 'Герои'],
                                    ['style', 'Слог']
                                ].map(([k, lbl]) => `
                                    <div class="criterion-box">
                                        <span>${lbl}</span>
                                        <select onchange="updateCriterion('${k}', this.value)">
                                            ${[0,1,2,3,4,5].map(n => `<option value="${n}" ${book.criteria?.[k] == n ? 'selected' : ''}>${n}</option>`).join('')}
                                        </select>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <div class="panel" style="display:flex; flex-direction:column; gap:14px;">
                        <div class="field" style="margin-bottom:0;">
                            <label>Цитаты из книги</label>
                            <textarea rows="5" oninput="updateBook('quotes', this.value)" placeholder="Выписывай цитаты...">${book.quotes || ''}</textarea>
                        </div>
                        <div class="field" style="margin-bottom:0; flex:1; display:flex; flex-direction:column;">
                            <label>Впечатления, разборы и заметки</label>
                            <textarea style="flex:1; min-height:190px;" oninput="updateBook('notes', this.value)" placeholder="Мысли по ходу чтения и после финала...">${book.notes || ''}</textarea>
                        </div>
                    </div>
                </div>
            `;
        }
    }

    render();
</script>
</body>
</html>
